name: APK Build (GitHub-hosted)

# Replaces the prior EAS-cloud build with a GitHub-hosted Gradle
# build so the project uses GitHub Actions' free runner minutes
# instead of EAS build credits. The result is a debug-signed APK
# uploaded to a GitHub Release that testers can download +
# sideload directly. Expo's managed workflow means we run
# `expo prebuild` fresh on each CI run to generate the android/
# project; nothing native is checked into the repo.
#
# OTA updates still flow through EAS via eas-update.yml - that
# workflow stays unchanged and uses EAS's free Updates tier.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/endless-escape-game-android-gRlFH
      - Github-APK-Transition-Escap
      - claude/game-review-suggestions-cjxiqh
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.js'
      - 'eas.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'android/**'
      - 'ios/**'
      - 'assets/icon.png'
      - 'assets/adaptive-icon.png'
      - 'assets/splash-icon.png'
      - 'assets/adaptive-icon-background.png'
      - '.github/workflows/apk-build.yml'

permissions:
  # softprops/action-gh-release needs write access to publish the
  # release + upload the APK as an asset.
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Release metadata baked into the APK (see app.config.js): the
    # versionCode is this workflow's run number (= the build-N release
    # tag) and the embedded manifest records the source commit.
    env:
      EE_BUILD_NUMBER: ${{ github.run_number }}
      EE_GIT_SHA: ${{ github.sha }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # A release build of the new-architecture native code fills most of
      # the runner disk; run 9 died in the post-build cache save with
      # "No space left on device". Drop preinstalled toolchains this
      # job never uses.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[0-6]* /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the long-retired `tools`
          # package, which current sdkmanager rejects (fails the job
          # before any build step). platform-tools is all we need; Gradle
          # fetches platforms / build-tools itself.
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Validation gates: never ship a build that fails typecheck or
      # the test suite.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Generate android/ project (expo prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: '1'

      # Record the update configuration the APK is built with, so each
      # build log proves which update stream the installed app follows.
      - name: Show embedded update configuration
        run: |
          grep -oE 'expo\.modules\.updates\.[A-Z_]+"[^/]*android:value="[^"]*"' android/app/src/main/AndroidManifest.xml || true
          grep -rhoE '"(runtimeVersion|updateUrl|requestHeaders|releaseChannel)"[^,}]*' android/app/src/main/res/values/strings.xml || true
          grep -E 'expo_runtime_version|versionCode|versionName' -r android/app/build.gradle android/app/src/main/res/values/strings.xml || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      # Release variant: the JS bundle is embedded and expo-updates is
      # active, so the installed APK checks the `preview` channel on
      # launch and applies OTA updates. (Debug builds disable
      # expo-updates and never receive OTAs.) Expo's prebuild template
      # signs release builds with the bundled debug keystore, so this
      # stays sideloadable with no signing secrets.
      - name: Build release APK
        working-directory: android
        # Real-device ABIs only (x86 / x86_64 are emulator-only): halves
        # native compile time and APK size.
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under android/app/build/outputs/apk/release"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=endless-escape-build-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"

      - name: Read app version
        id: ver
        run: |
          VER=$(node -p "require('./app.json').expo.version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Rename APK for upload
        run: cp "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.name }}"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      # Auto-publish a GitHub Release on every push so testers always
      # have a stable URL for the latest build. Manual (workflow_-
      # dispatch) runs skip this and just leave the APK as a workflow
      # artifact you can download from the run page.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 'APK build #${{ github.run_number }}'
          body: |
            Auto-built from commit `${{ github.sha }}`.

            **Version ${{ steps.ver.outputs.version }} • Build ${{ github.run_number }}** (runtime ${{ steps.ver.outputs.version }}, update channel `preview`)

            Release-variant APK (debug-keystore signed) with OTA updates enabled. Install via:
            1. Download the APK below.
            2. On your Android device, allow "install from unknown sources" for your browser / file manager.
            3. Open the downloaded APK to install.
          files: ${{ steps.apk.outputs.name }}
          token: ${{ secrets.GITHUB_TOKEN }}
