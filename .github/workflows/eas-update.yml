name: EAS Update (OTA)

on:
  workflow_dispatch:
  # JS-only pushes ship as OTA. Native/build/config changes are handled
  # by apk-build.yml instead (which embeds the new JS in the new APK).
  push:
    # Two active branches: the original gRlFH branch and the
    # Github-APK-Transition-Escap branch the user spun up to validate
    # the GitHub-hosted Gradle build. Both run the same OTA pipeline.
    branches:
      - claude/endless-escape-game-android-gRlFH
      - Github-APK-Transition-Escap
      - claude/game-review-suggestions-cjxiqh
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.js'
      - 'eas.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'android/**'
      - 'ios/**'
      - 'assets/icon.png'
      - 'assets/adaptive-icon.png'
      - 'assets/splash-icon.png'
      - 'assets/adaptive-icon-background.png'
      - '.github/workflows/**'
      - 'README.md'
      - '.gitignore'

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish OTA bundle
    runs-on: ubuntu-latest
    # Metadata stamped into the published update's manifest (see
    # app.config.js): the human-readable OTA sequence is this
    # workflow's run number; the source commit is the pushed SHA.
    env:
      EE_OTA_SEQUENCE: ${{ github.run_number }}
      EE_GIT_SHA: ${{ github.sha }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Validation gates: an update that fails typecheck or tests is
      # never published.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS }}

      # Publish to the `preview` CHANNEL (the header baked into every
      # APK by app.json updates.requestHeaders), so the destination is
      # by construction the stream installed APKs query. The update's
      # runtime version comes from app.json (policy: appVersion) and
      # must equal the installed APK's runtime to be eligible.
      - name: Publish update
        id: publish
        env:
          EXPO_TOKEN: ${{ secrets.EAS }}
        run: |
          MSG="OTA $(printf '%03d' "$EE_OTA_SEQUENCE") · $(git log -1 --pretty=%s | head -c 180)"
          eas update \
            --channel preview \
            --platform android \
            --message "$MSG" \
            --non-interactive \
            --json > update.json
          cat update.json

      - name: Record published update
        run: |
          node -e '
            const u = JSON.parse(require("fs").readFileSync("update.json", "utf8"));
            const list = Array.isArray(u) ? u : [u];
            const lines = ["## OTA " + String(process.env.EE_OTA_SEQUENCE).padStart(3, "0"), "",
              "| platform | update id | group | runtime | branch | commit |", "|---|---|---|---|---|---|"];
            for (const x of list) lines.push(`| ${x.platform} | ${x.id} | ${x.group} | ${x.runtimeVersion} | ${x.branch ?? ""} | ${x.gitCommitHash ?? process.env.EE_GIT_SHA} |`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          '
