name: EAS Build (APK)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
  # Auto-trigger when something changed that requires a native rebuild:
  # deps, native config, build config, platform code, or app icons.
  # JS-only changes do NOT match these paths and ship via eas-update.yml.
  push:
    # main holds only the workflow files (no source). Pushes there must
    # not trigger this workflow; the dev branch is where real code lives.
    branches:
      - claude/endless-escape-game-android-gRlFH
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'android/**'
      - 'ios/**'
      - 'assets/icon.png'
      - 'assets/adaptive-icon.png'
      - 'assets/splash-icon.png'
      - '.github/workflows/eas-build.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS }}

      - name: Resolve profile
        id: profile
        run: |
          if [ -n "${{ github.event.inputs.profile }}" ]; then
            echo "name=${{ github.event.inputs.profile }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Android build
        env:
          EXPO_TOKEN: ${{ secrets.EAS }}
        run: |
          npx eas build \
            --platform android \
            --profile "${{ steps.profile.outputs.name }}" \
            --non-interactive \
            --no-wait
