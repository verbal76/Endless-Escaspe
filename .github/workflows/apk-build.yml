name: APK Build (GitHub-hosted)

# Builds ONE release-variant, debug-signed APK from an explicitly approved
# source commit and publishes it (GitHub Actions' free runner minutes instead
# of EAS build credits). `expo prebuild` generates android/ fresh each run.
#
# Native build authorization is its own decision (docs/RELEASING.md,
# docs/ACTIONS-BUDGET.md). A source change, a branch push, a documentation
# edit, a version bump (release.json), or an OTA never starts this workflow.
# A build starts only from an explicit request that names the approved
# source SHA, platform and channel:
#   1. Run workflow (workflow_dispatch) with those inputs, or
#   2. commit a change to .github/build-request.json (auditable in git; the
#      path an agent session uses because it cannot dispatch).
# The build is made from EXACTLY that source SHA, never from the commit that
# carries the request, and records its provenance next to the APK. A rebuild
# of an already-released version produces a workflow artifact only (it never
# overwrites a public version), so no artificial version bump is needed.
#
# OTA updates are independent (eas-update.yml); they only publish JS whose
# native fingerprint matches the APKs.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform. Only android can be built here; windows / linux / all are refused visibly (docs/PLATFORM_SUPPORT.md)'
        type: choice
        options: [android, windows, linux, all]
        default: android
      source_sha:
        description: 'Approved source commit: the full 40-character SHA (not a branch name)'
        type: string
        required: true
      build_number:
        description: 'Coordinated build number of this release (must equal release.json publicVersion at the source SHA)'
        type: string
        required: true
      destination:
        description: 'github_releases publishes a numbered release (the number must be unused); local_only builds a workflow artifact only (a rebuild needs no new number)'
        type: choice
        options: [github_releases, local_only]
        default: github_releases
      channel:
        description: 'Release channel baked into the build'
        type: choice
        options: [preview]
        default: preview
  push:
    branches:
      - claude/game-review-suggestions-cjxiqh
      - claude/api36-native-qualification
    paths:
      - '.github/build-request.json'
    # This file deliberately does NOT list itself: an edit to the pipeline
    # alone must not cut a build. Test a workflow change with a manual run.

permissions:
  contents: read

concurrency:
  # One release build at a time; a build in progress is never cancelled by a
  # newer request (it queues).
  group: apk-build
  cancel-in-progress: false

jobs:
  # Cheap (seconds): turn the request into a validated source SHA.
  resolve:
    name: Resolve the build request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.req.outputs.source_sha }}
      platform: ${{ steps.req.outputs.platform }}
      channel: ${{ steps.req.outputs.channel }}
      build_number: ${{ steps.req.outputs.build_number }}
      destination: ${{ steps.req.outputs.destination }}
      request_commit: ${{ steps.req.outputs.request_commit }}
      request_ref: ${{ steps.req.outputs.request_ref }}
    steps:
      - name: Check out the requesting commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Every remote branch must be in docs/branch-ledger.json (warning only;
      # an unaccounted branch is visible on every build request).
      - name: Branch inventory
        run: node scripts/ci/branch-inventory.mjs
      - name: Validate the request
        id: req
        env:
          IN_SOURCE_SHA: ${{ inputs.source_sha }}
          IN_PLATFORM: ${{ inputs.platform }}
          IN_BUILD_NUMBER: ${{ inputs.build_number }}
          IN_DESTINATION: ${{ inputs.destination }}
          IN_CHANNEL: ${{ inputs.channel }}
        run: node scripts/ci/resolve-build-request.mjs

  build:
    name: Build Android APK
    needs: resolve
    # Pinned: Gradle / NDK / Android SDK layout and release signing depend on the runner image
    # (docs/COMPLIANCE-AUDIT.md F-14). The cheap resolve / publish jobs stay on ubuntu-latest as canaries.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      name: ${{ steps.apk.outputs.name }}
      product: ${{ steps.apk.outputs.product }}
      pv: ${{ steps.apk.outputs.pv }}
      version: ${{ steps.ver.outputs.version }}
      fingerprint: ${{ steps.fp.outputs.hash }}
      can_publish: ${{ steps.decide.outputs.can_publish }}
      sha256: ${{ steps.sum.outputs.sha }}
      size: ${{ steps.sum.outputs.size }}
    # Release metadata baked into the APK (see app.config.js): the
    # versionCode is this workflow's run number (= the build-N release
    # tag) and the embedded manifest records the APPROVED source commit.
    env:
      EE_BUILD_NUMBER: ${{ github.run_number }}
      EE_GIT_SHA: ${{ needs.resolve.outputs.source_sha }}
      EE_UPDATE_CHANNEL: ${{ needs.resolve.outputs.channel }}
    steps:
      # Exactly the approved source revision, never the requesting commit.
      - name: Check out the approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      # The coordinated build number is the public version in release.json at the approved source.
      - name: Check the build number
        run: |
          GOT=$(node -p "require('./release.json').publicVersion")
          if [ "$GOT" != "${{ needs.resolve.outputs.build_number }}" ]; then
            echo "::error::release.json at ${{ needs.resolve.outputs.source_sha }} says build $GOT, the request says build ${{ needs.resolve.outputs.build_number }}"
            exit 1
          fi

      # A build number identifies exactly one delivered build. Publishing to GitHub Releases needs an
      # unused number (checked here, before the expensive build); `local_only` produces a workflow
      # artifact without a release, so an authorized rebuild never needs an artificial new number.
      - name: Validate build-number uniqueness for the destination
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="$(node -p "require('./release.json').productName") v$(node -p "require('./release.json').publicVersion")"
          if [ "${{ needs.resolve.outputs.destination }}" = "github_releases" ]; then
            if gh release list --repo "${{ github.repository }}" --limit 200 --json name --jq '.[].name' | grep -Fxq "$TITLE"; then
              echo "::error::A release titled '$TITLE' already exists: a build number is never reused for different source content. Use a new build number, or destination local_only for a rebuild."
              exit 1
            fi
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::destination local_only: building a workflow artifact only, no GitHub Release."
            echo "can_publish=false" >> "$GITHUB_OUTPUT"
          fi

      # A release build of the new-architecture native code fills most of
      # the runner disk; run 9 died in the post-build cache save with
      # "No space left on device". Drop preinstalled toolchains this
      # job never uses.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[0-6]* /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the long-retired `tools`
          # package, which current sdkmanager rejects (fails the job
          # before any build step). platform-tools is all we need; Gradle
          # fetches platforms / build-tools itself.
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Validation gates: never ship a build that fails typecheck or
      # the test suite.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Record which native layer this APK carries. eas-update.yml only
      # publishes OTAs whose fingerprint equals the one recorded for
      # app.json's version in scripts/native-fingerprint.json; a new
      # runtime's hash must be recorded there (--record) in the same
      # change that bumps the version.
      - name: Native fingerprint
        id: fp
        run: |
          node scripts/check-native-fingerprint.mjs --print | tee fingerprint.txt
          HASH=$(sed -n 's/^native fingerprint (android) for app version [^:]*: //p' fingerprint.txt)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          if ! node scripts/check-native-fingerprint.mjs --hash "$HASH" > /dev/null 2>&1; then
            echo "::warning::The native fingerprint $HASH is not the one recorded for this app version: OTAs for this runtime will be refused until scripts/native-fingerprint.json is updated (see the step log)."
          fi

      # Pre-install the pinned NDK with retries instead of Gradle's
      # on-demand download (a corrupt download failed a render-check run).
      - name: Install NDK
        run: bash scripts/ci/install-ndk.sh

      - name: Generate android/ project (expo prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: '1'

      # Record the update configuration the APK is built with, so each
      # build log proves which update stream the installed app follows.
      - name: Show embedded update configuration
        run: |
          grep -oE 'expo\.modules\.updates\.[A-Z_]+"[^/]*android:value="[^"]*"' android/app/src/main/AndroidManifest.xml || true
          grep -rhoE '"(runtimeVersion|updateUrl|requestHeaders|releaseChannel)"[^,}]*' android/app/src/main/res/values/strings.xml || true
          grep -E 'expo_runtime_version|versionCode|versionName' -r android/app/build.gradle android/app/src/main/res/values/strings.xml || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      # Release variant: the JS bundle is embedded and expo-updates is
      # active, so the installed APK checks the `preview` channel on
      # launch and applies OTA updates. (Debug builds disable
      # expo-updates and never receive OTAs.) Expo's prebuild template
      # signs release builds with the bundled debug keystore, so this
      # stays sideloadable with no signing secrets.
      - name: Build release APK
        working-directory: android
        # Real-device ABIs only (x86 / x86_64 are emulator-only): halves
        # native compile time and APK size.
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under android/app/build/outputs/apk/release"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          # Public name: <Product>-v<N>.apk, N from release.json (docs/RELEASING.md).
          SLUG=$(node -p "require('./release.json').fileSlug")
          PV=$(node -p "require('./release.json').publicVersion")
          echo "name=${SLUG}-v${PV}.apk" >> "$GITHUB_OUTPUT"
          echo "product=$(node -p "require('./release.json').productName")" >> "$GITHUB_OUTPUT"
          echo "pv=$PV" >> "$GITHUB_OUTPUT"
          echo "provenance=build-manifest.json" >> "$GITHUB_OUTPUT"

      - name: Read app version
        id: ver
        run: |
          VER=$(node -p "require('./app.json').expo.version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Rename APK for upload
        run: cp "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.name }}"

      # Inspect the built APK itself (package, versionCode, targetSdk,
      # permissions, signing, 16 KB alignment); fails the build on a
      # violation. See scripts/ci/verify-apk.sh.
      - name: Verify APK (artifact-level compliance)
        run: bash scripts/ci/verify-apk.sh "${{ steps.apk.outputs.name }}" com.verbal76.endlessescaspe "${{ github.run_number }}" 36

      # What is packaged inside: studio logo, studio splash code, app icon,
      # runtime and native fingerprint. See scripts/ci/verify-apk-content.sh.
      - name: Verify packaged content
        run: bash scripts/ci/verify-apk-content.sh "${{ steps.apk.outputs.name }}" "${{ steps.ver.outputs.version }}" "${{ steps.fp.outputs.hash }}"

      # Can this APK install over the previous build? Same package AND same
      # signing certificate. Compares against the published Build 13 asset.
      - name: Compare signing certificate with Build 13
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          gh release download build-13 --repo "${{ github.repository }}" --pattern '*.apk' --output build13.apk
          NEW=$("$BT/apksigner" verify --print-certs "${{ steps.apk.outputs.name }}" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          OLD=$("$BT/apksigner" verify --print-certs build13.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          {
            echo "--- signing continuity vs Build 13"
            echo "build13 cert sha256: $OLD"
            echo "this    cert sha256: $NEW"
            if [ -n "$NEW" ] && [ "$NEW" = "$OLD" ]; then echo "SAME CERTIFICATE: can update Build 13 in place"; else echo "DIFFERENT CERTIFICATE: cannot update Build 13 in place"; fi
          } | tee -a apk-report.txt
          rm -f build13.apk

      - name: Checksums and build manifest (verified against the packaged file)
        id: sum
        env:
          PLATFORM: ${{ needs.resolve.outputs.platform }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          ARTIFACT_NAME: ${{ steps.apk.outputs.name }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          REQUEST_COMMIT: ${{ needs.resolve.outputs.request_commit }}
          REQUEST_REF: ${{ needs.resolve.outputs.request_ref }}
          VERSION_CODE: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FINGERPRINT: ${{ steps.fp.outputs.hash }}
          JAVA_VERSION: 17
          PROVENANCE_OUT: ${{ steps.apk.outputs.provenance }}
        run: |
          SHA=$(sha256sum "${{ steps.apk.outputs.name }}" | cut -d' ' -f1)
          SIZE=$(stat -c %s "${{ steps.apk.outputs.name }}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"; echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          ARTIFACT_SHA256=$SHA ARTIFACT_SIZE=$SIZE node scripts/ci/write-provenance.mjs
          sha256sum "${{ steps.apk.outputs.name }}" > checksums.sha256
          sha256sum -c checksums.sha256
          node scripts/ci/write-provenance.mjs --verify "$PROVENANCE_OUT" checksums.sha256 "${{ steps.apk.outputs.name }}"
          cat "$PROVENANCE_OUT"

      - name: Upload APK report
        uses: actions/upload-artifact@v4
        with:
          name: apk-report-${{ github.run_number }}
          path: apk-report.txt
          retention-days: 30

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.provenance }}
            checksums.sha256
          if-no-files-found: error
          # The same file is attached to the GitHub release (publish job).
          retention-days: 30

  # Emulator smoke test of the SAME commit (x86_64 build of identical JS,
  # assets and native modules; the emulator cannot run the ARM phone APK):
  # install, cold launch, studio card, game boot + render audit, restart,
  # background / resume. The release is published only if it passes.
  smoke-test:
    name: Emulator smoke test
    needs: resolve
    uses: ./.github/workflows/android-render-check.yml
    with:
      ref: ${{ needs.resolve.outputs.source_sha }}
    permissions:
      contents: read

  publish:
    name: Publish GitHub Release
    needs: [resolve, build, smoke-test]
    if: needs.build.outputs.can_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the verified APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}
          path: dist

      # The newest delivered playable build is the Latest release (see
      # docs/RELEASING.md). The build-N tag is created at the commit that
      # was built (without target_commitish GitHub tags the default branch).
      - name: Publish GitHub Release
        # v2.6.2, pinned by commit: third-party action with contents: write.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ needs.resolve.outputs.source_sha }}
          name: '${{ needs.build.outputs.product }} v${{ needs.build.outputs.pv }}'
          prerelease: false
          make_latest: true
          body: |
            # ${{ needs.build.outputs.product }} v${{ needs.build.outputs.pv }}

            **Android:** `${{ needs.build.outputs.name }}`

            ## Technical details (engineers only)
            Built from approved source commit `${{ needs.resolve.outputs.source_sha }}` (request ref `${{ needs.resolve.outputs.request_ref }}` at `${{ needs.resolve.outputs.request_commit }}`); `build-manifest.json` and `checksums.sha256` attached.

            Android versionName ${{ needs.build.outputs.version }} • versionCode ${{ github.run_number }} • tag `build-${{ github.run_number }}` (runtime ${{ needs.build.outputs.version }}, update channel `preview`)

            Native fingerprint (android): `${{ needs.build.outputs.fingerprint }}`

            SHA-256: `${{ needs.build.outputs.sha256 }}` • ${{ needs.build.outputs.size }} bytes

            Release-variant APK (debug-keystore signed, same certificate as Build 13) with OTA updates enabled. Install via:
            1. Download the APK below.
            2. On your Android device, allow "install from unknown sources" for your browser / file manager.
            3. Open the downloaded APK to install.
          files: |
            dist/${{ needs.build.outputs.name }}
            dist/build-manifest.json
            dist/checksums.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
