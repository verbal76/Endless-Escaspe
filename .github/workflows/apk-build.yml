name: Coordinated Build (Android, Windows, Linux)

# Builds the release-variant debug-signed APK, the Windows x86-64 zip and the
# Linux x86-64 archive of ONE build from ONE explicitly approved source commit
# (GitHub Actions' free runner minutes instead of EAS build credits) and, only
# when asked, publishes them together as one GitHub Release named
# "Endless Escape Build NN". `expo prebuild` generates android/ fresh each run.
# (The file keeps its historical name apk-build.yml: the workflow id, the
# request file and the docs refer to it.)
#
# Native build authorization is its own decision (docs/RELEASING.md,
# docs/ACTIONS-BUDGET.md). A source change, a branch push, a documentation
# edit, a version bump (release.json), or an OTA never starts this workflow.
# A build starts only from an explicit request that names the approved
# source SHA, platform and channel:
#   1. Run workflow (workflow_dispatch) with those inputs, or
#   2. commit a change to .github/build-request.json (auditable in git; the
#      path an agent session uses because it cannot dispatch).
# The build is made from EXACTLY that source SHA, never from the commit that
# carries the request, and records its provenance next to the APK. A rebuild
# of an already-released version produces a workflow artifact only (it never
# overwrites a public version), so no artificial version bump is needed.
#
# OTA updates are independent (eas-update.yml); they only publish JS whose
# native fingerprint matches the APKs.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform. A GitHub Release needs all; a single platform is a workflow artifact only (destination local_only)'
        type: choice
        options: [android, windows, linux, all]
        default: all
      source_sha:
        description: 'Approved source commit: the full 40-character SHA (not a branch name)'
        type: string
        required: true
      build_number:
        description: 'Coordinated build number NN of this release (must equal release.json publicVersion at the source SHA; the same NN names all three artifacts)'
        type: string
        required: true
      destination:
        description: 'github_releases publishes one coordinated release (platform all; the number must be unused); local_only builds a workflow artifact only (a rebuild needs no new number)'
        type: choice
        options: [github_releases, local_only]
        default: github_releases
      channel:
        description: 'Release channel baked into the build'
        type: choice
        options: [preview]
        default: preview
  push:
    branches:
      - claude/game-review-suggestions-cjxiqh
      - claude/api36-native-qualification
    paths:
      - '.github/build-request.json'
    # This file deliberately does NOT list itself: an edit to the pipeline
    # alone must not cut a build. Test a workflow change with a manual run.

permissions:
  contents: read

concurrency:
  # One release build at a time; a build in progress is never cancelled by a
  # newer request (it queues).
  group: apk-build
  cancel-in-progress: false

jobs:
  # Cheap (seconds): turn the request into a validated source SHA.
  resolve:
    name: Resolve the build request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.req.outputs.source_sha }}
      platform: ${{ steps.req.outputs.platform }}
      channel: ${{ steps.req.outputs.channel }}
      build_number: ${{ steps.req.outputs.build_number }}
      destination: ${{ steps.req.outputs.destination }}
      request_commit: ${{ steps.req.outputs.request_commit }}
      request_ref: ${{ steps.req.outputs.request_ref }}
    steps:
      - name: Check out the requesting commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Every remote branch must be in docs/branch-ledger.json (warning only;
      # an unaccounted branch is visible on every build request).
      - name: Branch inventory
        run: node scripts/ci/branch-inventory.mjs
      - name: Validate the request
        id: req
        env:
          IN_SOURCE_SHA: ${{ inputs.source_sha }}
          IN_PLATFORM: ${{ inputs.platform }}
          IN_BUILD_NUMBER: ${{ inputs.build_number }}
          IN_DESTINATION: ${{ inputs.destination }}
          IN_CHANNEL: ${{ inputs.channel }}
        run: node scripts/ci/resolve-build-request.mjs

  # Cheap (seconds): the build number is consistent with the approved source and, for a release, unused.
  validate:
    name: Validate the build number
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      can_publish: ${{ steps.decide.outputs.can_publish }}
      product: ${{ steps.num.outputs.product }}
    steps:
      # Exactly the approved source revision, never the requesting commit.
      - name: Check out the approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      # The coordinated build number is the public version in release.json at the approved source.
      - name: Check the build number
        id: num
        run: |
          GOT=$(node -p "require('./release.json').publicVersion")
          if [ "$GOT" != "${{ needs.resolve.outputs.build_number }}" ]; then
            echo "::error::release.json at ${{ needs.resolve.outputs.source_sha }} says build $GOT, the request says build ${{ needs.resolve.outputs.build_number }}"
            exit 1
          fi
          echo "product=$(node -p "require('./release.json').productName")" >> "$GITHUB_OUTPUT"
      # A build number identifies exactly one delivered build. A release needs an unused number: no release titled
      # "<product> Build NN" or with the legacy "<product> vNN" title, and no tag of the new scheme. `local_only`
      # produces a workflow artifact without a release, so an authorized rebuild never needs an artificial new number.
      - name: Validate build-number uniqueness for the destination
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRODUCT="$(node -p "require('./release.json').productName")"
          N="${{ needs.resolve.outputs.build_number }}"
          if [ "${{ needs.resolve.outputs.destination }}" = "github_releases" ]; then
            NAMES="$(gh release list --repo "${{ github.repository }}" --limit 300 --json name --jq '.[].name')"
            for TITLE in "$PRODUCT Build $N" "$PRODUCT v$N"; do
              if printf '%s\n' "$NAMES" | grep -Fxq "$TITLE"; then
                echo "::error::A release titled '$TITLE' already exists: a build number is never reused for different source content. Use a new build number, or destination local_only for a rebuild."
                exit 1
              fi
            done
            if gh release view "endless-escape-build-$N" --repo "${{ github.repository }}" > /dev/null 2>&1; then
              echo "::error::The tag endless-escape-build-$N already exists."
              exit 1
            fi
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::destination local_only: building workflow artifacts only, no GitHub Release."
            echo "can_publish=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Android APK
    needs: [resolve, validate]
    if: needs.resolve.outputs.platform == 'android' || needs.resolve.outputs.platform == 'all'
    # Pinned: Gradle / NDK / Android SDK layout and release signing depend on the runner image
    # (docs/COMPLIANCE-AUDIT.md F-14). The cheap resolve / publish jobs stay on ubuntu-latest as canaries.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      name: ${{ steps.apk.outputs.name }}
      product: ${{ steps.apk.outputs.product }}
      pv: ${{ steps.apk.outputs.pv }}
      version: ${{ steps.ver.outputs.version }}
      fingerprint: ${{ steps.fp.outputs.hash }}
    # Release metadata baked into the APK (see app.config.js): the
    # versionCode is this workflow's run number (monotonic, Android update
    # compatibility; unrelated to the public Build NN) and the embedded
    # manifest records the APPROVED source commit.
    env:
      EE_BUILD_NUMBER: ${{ github.run_number }}
      EE_GIT_SHA: ${{ needs.resolve.outputs.source_sha }}
      EE_UPDATE_CHANNEL: ${{ needs.resolve.outputs.channel }}
    steps:
      # Exactly the approved source revision, never the requesting commit.
      - name: Check out the approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      # A release build of the new-architecture native code fills most of
      # the runner disk; run 9 died in the post-build cache save with
      # "No space left on device". Drop preinstalled toolchains this
      # job never uses.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[0-6]* /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the long-retired `tools`
          # package, which current sdkmanager rejects (fails the job
          # before any build step). platform-tools is all we need; Gradle
          # fetches platforms / build-tools itself.
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Validation gates: never ship a build that fails typecheck or
      # the test suite.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Record which native layer this APK carries. eas-update.yml only
      # publishes OTAs whose fingerprint equals the one recorded for
      # app.json's version in scripts/native-fingerprint.json; a new
      # runtime's hash must be recorded there (--record) in the same
      # change that bumps the version.
      - name: Native fingerprint
        id: fp
        run: |
          node scripts/check-native-fingerprint.mjs --print | tee fingerprint.txt
          HASH=$(sed -n 's/^native fingerprint (android) for app version [^:]*: //p' fingerprint.txt)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          if ! node scripts/check-native-fingerprint.mjs --hash "$HASH" > /dev/null 2>&1; then
            echo "::warning::The native fingerprint $HASH is not the one recorded for this app version: OTAs for this runtime will be refused until scripts/native-fingerprint.json is updated (see the step log)."
          fi

      # Pre-install the pinned NDK with retries instead of Gradle's
      # on-demand download (a corrupt download failed a render-check run).
      - name: Install NDK
        run: bash scripts/ci/install-ndk.sh

      - name: Generate android/ project (expo prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: '1'

      # Record the update configuration the APK is built with, so each
      # build log proves which update stream the installed app follows.
      - name: Show embedded update configuration
        run: |
          grep -oE 'expo\.modules\.updates\.[A-Z_]+"[^/]*android:value="[^"]*"' android/app/src/main/AndroidManifest.xml || true
          grep -rhoE '"(runtimeVersion|updateUrl|requestHeaders|releaseChannel)"[^,}]*' android/app/src/main/res/values/strings.xml || true
          grep -E 'expo_runtime_version|versionCode|versionName' -r android/app/build.gradle android/app/src/main/res/values/strings.xml || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      # Release variant: the JS bundle is embedded and expo-updates is
      # active, so the installed APK checks the `preview` channel on
      # launch and applies OTA updates. (Debug builds disable
      # expo-updates and never receive OTAs.) Expo's prebuild template
      # signs release builds with the bundled debug keystore, so this
      # stays sideloadable with no signing secrets.
      - name: Build release APK
        working-directory: android
        # Real-device ABIs only (x86 / x86_64 are emulator-only): halves
        # native compile time and APK size.
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under android/app/build/outputs/apk/release"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          # Public name: "<Product> Build <NN> APK.apk", NN = the coordinated build number (docs/RELEASING.md).
          PRODUCT=$(node -p "require('./release.json').productName")
          PV=$(node -p "require('./release.json').publicVersion")
          echo "name=${PRODUCT} Build ${PV} APK.apk" >> "$GITHUB_OUTPUT"
          echo "product=$PRODUCT" >> "$GITHUB_OUTPUT"
          echo "pv=$PV" >> "$GITHUB_OUTPUT"
          echo "provenance=android.details.json" >> "$GITHUB_OUTPUT"

      - name: Read app version
        id: ver
        run: |
          VER=$(node -p "require('./app.json').expo.version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Rename APK for upload
        run: cp "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.name }}"

      # Inspect the built APK itself (package, versionCode, targetSdk,
      # permissions, signing, 16 KB alignment); fails the build on a
      # violation. See scripts/ci/verify-apk.sh.
      - name: Verify APK (artifact-level compliance)
        run: bash scripts/ci/verify-apk.sh "${{ steps.apk.outputs.name }}" com.verbal76.endlessescaspe "${{ github.run_number }}" 36

      # What is packaged inside: studio logo, studio splash code, app icon,
      # runtime and native fingerprint. See scripts/ci/verify-apk-content.sh.
      - name: Verify packaged content
        run: bash scripts/ci/verify-apk-content.sh "${{ steps.apk.outputs.name }}" "${{ steps.ver.outputs.version }}" "${{ steps.fp.outputs.hash }}"

      # Can this APK install over the previous build? Same package AND same
      # signing certificate. Compares against the published Build 13 asset.
      - name: Compare signing certificate with Build 13
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          gh release download build-13 --repo "${{ github.repository }}" --pattern '*.apk' --output build13.apk
          NEW=$("$BT/apksigner" verify --print-certs "${{ steps.apk.outputs.name }}" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          OLD=$("$BT/apksigner" verify --print-certs build13.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          {
            echo "--- signing continuity vs Build 13"
            echo "build13 cert sha256: $OLD"
            echo "this    cert sha256: $NEW"
            if [ -n "$NEW" ] && [ "$NEW" = "$OLD" ]; then echo "SAME CERTIFICATE: can update Build 13 in place"; else echo "DIFFERENT CERTIFICATE: cannot update Build 13 in place"; fi
          } | tee -a apk-report.txt
          rm -f build13.apk

      # Android provenance (per-APK record, verified against the packaged file). The coordinated build-manifest.json
      # and checksums.sha256 of the whole release are written by the `bundle` job from the final bytes.
      - name: Android provenance record (verified against the packaged file)
        id: sum
        env:
          PLATFORM: android
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          ARTIFACT_NAME: ${{ steps.apk.outputs.name }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          REQUEST_COMMIT: ${{ needs.resolve.outputs.request_commit }}
          REQUEST_REF: ${{ needs.resolve.outputs.request_ref }}
          VERSION_CODE: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FINGERPRINT: ${{ steps.fp.outputs.hash }}
          JAVA_VERSION: 17
          PROVENANCE_OUT: ${{ steps.apk.outputs.provenance }}
        run: |
          SHA=$(sha256sum "${{ steps.apk.outputs.name }}" | cut -d' ' -f1)
          SIZE=$(stat -c %s "${{ steps.apk.outputs.name }}")
          ARTIFACT_SHA256=$SHA ARTIFACT_SIZE=$SIZE node scripts/ci/write-provenance.mjs
          sha256sum "${{ steps.apk.outputs.name }}" > checksums.sha256
          sha256sum -c checksums.sha256
          node scripts/ci/write-provenance.mjs --verify "$PROVENANCE_OUT" checksums.sha256 "${{ steps.apk.outputs.name }}"
          cat "$PROVENANCE_OUT"
          # The sidecar is named for the platform so the bundle job can embed it.
          mv "$PROVENANCE_OUT" android.details.json

      - name: Upload APK report
        uses: actions/upload-artifact@v4
        with:
          name: apk-report-${{ github.run_number }}
          path: apk-report.txt
          retention-days: 30

      - name: Upload the Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-android
          path: |
            ${{ steps.apk.outputs.name }}
            android.details.json
          if-no-files-found: error
          retention-days: 30

  # Emulator smoke test of the SAME commit (x86_64 build of identical JS,
  # assets and native modules; the emulator cannot run the ARM phone APK):
  # install, cold launch, studio card, game boot + render audit, restart,
  # background / resume. The release is published only if it passes.
  smoke-test:
    name: Emulator smoke test
    needs: [resolve, validate]
    if: needs.resolve.outputs.platform == 'android' || needs.resolve.outputs.platform == 'all'
    uses: ./.github/workflows/android-render-check.yml
    with:
      ref: ${{ needs.resolve.outputs.source_sha }}
    permissions:
      contents: read

  # Windows x86-64 and Linux x86-64: the SAME web export and game source as Android (docs/PLATFORM_SUPPORT.md), wrapped
  # in the Electron shell in desktop/. Both are cheap Linux-runner jobs. The Linux archive is unpacked and launched
  # under xvfb (smoke test); the Windows zip is cross-packaged and structurally verified, it is NOT executed here.
  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: [resolve, validate]
    if: needs.resolve.outputs.platform != 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]
    steps:
      - name: Skip a platform that was not requested
        id: want
        run: |
          REQ="${{ needs.resolve.outputs.platform }}"
          if [ "$REQ" = "all" ] || [ "$REQ" = "${{ matrix.platform }}" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "::notice::${{ matrix.platform }} not requested"; fi
      - name: Check out the approved source
        if: steps.want.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - name: Set up Node
        if: steps.want.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        if: steps.want.outputs.run == 'true'
        run: npm ci --no-audit --no-fund
      - name: Typecheck and unit tests
        if: steps.want.outputs.run == 'true'
        run: |
          npm run typecheck
          npm test
      # The desktop shell must not change the Android runtime.
      - name: Native fingerprint is unchanged by the desktop work
        if: steps.want.outputs.run == 'true'
        run: node scripts/check-native-fingerprint.mjs
      - name: Install the desktop shell
        if: steps.want.outputs.run == 'true'
        run: npm ci --no-audit --no-fund --prefix desktop
      - name: Package ${{ matrix.platform }}
        if: steps.want.outputs.run == 'true'
        env:
          EE_PRODUCT: ${{ needs.validate.outputs.product }}
          EE_BUILD: ${{ needs.resolve.outputs.build_number }}
        run: |
          node scripts/desktop/package.mjs --platform "${{ matrix.platform }}" --out out --name "$EE_PRODUCT Build $EE_BUILD $([ "${{ matrix.platform }}" = "linux" ] && echo Linux || echo EXE)"
          ls -la out
      - name: Smoke test the Linux build (real launch under xvfb)
        if: steps.want.outputs.run == 'true' && matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64 > /dev/null
          mkdir unpacked && tar -xzf out/*.tar.gz -C unpacked
          xvfb-run -a -s "-screen 0 1280x800x24" node scripts/desktop/smoke.mjs "unpacked/Endless Escape"
      - name: Structurally verify the Windows zip (not executed)
        if: steps.want.outputs.run == 'true' && matrix.platform == 'windows'
        run: |
          unzip -l out/*.zip | grep -F 'Endless Escape/EndlessEscape.exe'
          unzip -l out/*.zip | grep -F 'Endless Escape/resources/app/web/index.html'
          unzip -p out/*.zip 'Endless Escape/EndlessEscape.exe' | head -c 2 | grep -q MZ
          echo "Windows x86-64 package assembled and checked structurally; it was not run on this Linux runner."
      - name: Upload the ${{ matrix.platform }} artifact
        if: steps.want.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.platform }}
          path: |
            out/*.tar.gz
            out/*.zip
            out/${{ matrix.platform }}.details.json
          if-no-files-found: error
          retention-days: 30

  # Assemble ONE coordinated bundle (APK + EXE zip + Linux archive + build-manifest.json + checksums.sha256) from the
  # verified platform artifacts, then verify the bundle again. A release is all-or-nothing: a missing or failed
  # platform fails this job, so nothing partial can ever reach `publish`.
  bundle:
    name: Assemble and verify the coordinated bundle
    needs: [resolve, validate, build, smoke-test, desktop]
    # Skipped (not requested) platforms are fine; failed or cancelled ones are not.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.validate.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the approved source (scripts and release.json)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - name: Download the platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          merge-multiple: true
          path: in
      - name: Assemble the bundle
        run: |
          case "${{ needs.resolve.outputs.platform }}" in
            all) PLATFORMS=android,windows,linux ;;
            *) PLATFORMS="${{ needs.resolve.outputs.platform }}" ;;
          esac
          ls -la in
          node scripts/ci/assemble-release.mjs --in in --out bundle --build "${{ needs.resolve.outputs.build_number }}" --source-sha "${{ needs.resolve.outputs.source_sha }}" --platforms "$PLATFORMS" --destination "${{ needs.resolve.outputs.destination }}" --run-id "${{ github.run_id }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --request-commit "${{ needs.resolve.outputs.request_commit }}" --request-ref "${{ needs.resolve.outputs.request_ref }}"
          (cd bundle && sha256sum -c checksums.sha256)
          cat bundle/build-manifest.json
      - name: Upload the coordinated bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-build-${{ needs.resolve.outputs.build_number }}
          path: bundle
          if-no-files-found: error
          retention-days: 30

  # The ONLY job that can publish, and only for destination github_releases with platform all (enforced by resolve).
  publish:
    name: Publish GitHub Release
    needs: [resolve, validate, bundle]
    if: needs.validate.outputs.can_publish == 'true' && needs.resolve.outputs.destination == 'github_releases' && needs.resolve.outputs.platform == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the approved source (scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - name: Download the verified bundle
        uses: actions/download-artifact@v4
        with:
          name: bundle-build-${{ needs.resolve.outputs.build_number }}
          path: dist
      - name: Re-verify the bundle (all three platforms, manifest and checksums agree)
        run: node scripts/ci/assemble-release.mjs --verify dist --platforms android,windows,linux
      # The newest delivered playable build is the Latest release (docs/RELEASING.md). The tag is created at the commit
      # that was built (without target_commitish GitHub tags the default branch). Legacy build-N tags are untouched.
      - name: Publish GitHub Release
        # v2.6.2, pinned by commit: third-party action with contents: write.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: endless-escape-build-${{ needs.resolve.outputs.build_number }}
          target_commitish: ${{ needs.resolve.outputs.source_sha }}
          name: '${{ needs.validate.outputs.product }} Build ${{ needs.resolve.outputs.build_number }}'
          prerelease: false
          make_latest: true
          body: |
            # ${{ needs.validate.outputs.product }} Build ${{ needs.resolve.outputs.build_number }}

            | Platform | File |
            | --- | --- |
            | Android | `${{ needs.validate.outputs.product }} Build ${{ needs.resolve.outputs.build_number }} APK.apk` |
            | Windows x86-64 | `${{ needs.validate.outputs.product }} Build ${{ needs.resolve.outputs.build_number }} EXE.zip` |
            | Linux x86-64 | `${{ needs.validate.outputs.product }} Build ${{ needs.resolve.outputs.build_number }} Linux.tar.gz` |

            ## Technical details (engineers only)
