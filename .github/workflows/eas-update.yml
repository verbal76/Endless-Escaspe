name: EAS Update (OTA)

on:
  workflow_dispatch:
  # JS-only pushes ship as OTA. Native/build/config changes are handled
  # by apk-build.yml instead (which embeds the new JS in the new APK).
  push:
    # Two active branches: the original gRlFH branch and the
    # Github-APK-Transition-Escap branch the user spun up to validate
    # the GitHub-hosted Gradle build. Both run the same OTA pipeline.
    branches:
      - claude/endless-escape-game-android-gRlFH
      - Github-APK-Transition-Escap
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'android/**'
      - 'ios/**'
      - 'assets/icon.png'
      - 'assets/adaptive-icon.png'
      - 'assets/splash-icon.png'
      - '.github/workflows/**'
      - 'README.md'
      - '.gitignore'

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish OTA bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS }}

      - name: Publish update
        env:
          EXPO_TOKEN: ${{ secrets.EAS }}
        run: |
          MSG=$(git log -1 --pretty=%s | head -c 200)
          eas update \
            --branch preview \
            --message "$MSG" \
            --non-interactive
