name: Production build (EAS, manual only)

# Starts an EAS cloud build signed with the project's EAS-MANAGED upload
# key (eas.json profiles `production` = AAB, `production-apk` = APK).
# The existing tester pipeline (apk-build.yml, debug-keystore APK on
# GitHub runners) is untouched and stays the default.
#
# SAFETY: this workflow can only be started by hand (workflow_dispatch;
# there is deliberately no push, pull_request, schedule or workflow_call
# trigger: tests/productionWorkflow.test.ts fails if one is added) and
# only runs when `confirm` is typed exactly. It never creates
# credentials: `--non-interactive` makes EAS fail if the production
# keystore does not exist yet. Creating it is an owner-only step
# (docs/native-batch.md, "Owner-only steps"). It does not submit to any
# store and publishes no OTA.
#
# Cost: one EAS build (free-plan monthly build quota applies). The job
# uses `--no-wait`, so it only queues the build (~2 minutes of Actions);
# follow the build on the URL printed in the summary.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BUILD PRODUCTION to start an EAS production build'
        type: string
        required: true
      profile:
        description: 'eas.json build profile'
        type: choice
        options: [production-apk, production]
        default: production-apk
      version:
        description: 'app.json version you expect to build (guards against the wrong branch)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: production-build
  cancel-in-progress: false

jobs:
  build:
    name: Queue EAS production build
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'BUILD PRODUCTION'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROFILE: ${{ inputs.profile }}
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check the version and the native fingerprint
        run: |
          ACTUAL=$(node -p "require('./app.json').expo.version")
          if [ "$ACTUAL" != "$EXPECTED_VERSION" ]; then
            echo "::error::app.json version is $ACTUAL on $GITHUB_REF_NAME, expected $EXPECTED_VERSION"
            exit 1
          fi
          node scripts/check-native-fingerprint.mjs

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: 24.9.0
          token: ${{ secrets.EAS }}

      - name: Queue the build
        env:
          EXPO_TOKEN: ${{ secrets.EAS }}
        run: |
          eas build --platform android --profile "$PROFILE" --non-interactive --no-wait --json | tee build.json
          node -e '
            const b = JSON.parse(require("fs").readFileSync("build.json", "utf8"));
            const list = Array.isArray(b) ? b : [b];
            const lines = ["## Production build queued", "", `ref ${process.env.GITHUB_REF_NAME} @ ${process.env.GITHUB_SHA}`, ""];
            for (const x of list) lines.push(`- ${x.id}: ${x.buildDetailsPageUrl ?? x.id}`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
