name: Cleanup old artifacts

# Manual one-shot to free up "Actions storage" quota by deleting all
# but the most recent workflow-run artifacts. Releases are NOT touched
# (release assets are unlimited - only the per-run upload-artifact
# blobs count against the storage quota that throws "artifact limit
# reached" errors).
#
# Run from: Actions tab -> "Cleanup old artifacts" -> Run workflow.
# The default "keep" count is 3; bump it via the input box on the
# Run workflow form for one-off larger keep windows.

on:
  workflow_dispatch:
    inputs:
      keep:
        description: 'Number of most-recent artifacts to keep'
        required: false
        default: '3'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ inputs.keep }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          : "${KEEP:=3}"

          # Newest-first list of non-expired artifact IDs (+ names so the
          # log shows what got deleted). per_page=100 covers up to 100
          # artifacts in one page; bump pagination if you ever exceed that.
          mapfile -t LINES < <(
            gh api "repos/$REPO/actions/artifacts?per_page=100" \
              --jq '.artifacts
                    | map(select(.expired == false))
                    | sort_by(.created_at) | reverse
                    | .[] | "\(.id)\t\(.name)\t\(.created_at)"'
          )

          echo "Found ${#LINES[@]} non-expired artifact(s). Keeping the newest $KEEP."
          echo ""

          COUNT=0
          for L in "${LINES[@]}"; do
            COUNT=$((COUNT+1))
            ID=$(awk -F'\t' '{print $1}' <<<"$L")
            NAME=$(awk -F'\t' '{print $2}' <<<"$L")
            DATE=$(awk -F'\t' '{print $3}' <<<"$L")
            if [ "$COUNT" -le "$KEEP" ]; then
              echo "  keep    #$COUNT  $NAME  ($DATE)  id=$ID"
            else
              echo "  delete  #$COUNT  $NAME  ($DATE)  id=$ID"
              gh api -X DELETE "repos/$REPO/actions/artifacts/$ID" >/dev/null
            fi
          done

          echo ""
          echo "Done. Kept $(( COUNT < KEEP ? COUNT : KEEP )), deleted $(( COUNT > KEEP ? COUNT - KEEP : 0 ))."
