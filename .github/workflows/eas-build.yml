name: EAS Build (APK)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS }}

      - name: Resolve profile
        id: profile
        run: |
          if [ -n "${{ github.event.inputs.profile }}" ]; then
            echo "name=${{ github.event.inputs.profile }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Android build
        env:
          EXPO_TOKEN: ${{ secrets.EAS }}
        run: |
          npx eas build \
            --platform android \
            --profile "${{ steps.profile.outputs.name }}" \
            --non-interactive \
            --no-wait
