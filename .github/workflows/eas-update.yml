name: EAS Update (OTA)

# Publishes the JS bundle of the publishing branch to the `preview`
# channel that every installed APK follows. An OTA is an explicit release
# decision (docs/RELEASING.md, docs/ACTIONS-BUDGET.md): a push, a merge or a
# version bump NEVER publishes. It starts only from a manual run (Actions ->
# EAS Update (OTA) -> Run workflow) on the publishing branch that names the exact
# source commit (the full SHA of the branch head). Nothing is published unless,
# for that same commit:
#   0. authorize    the run is on the publishing branch and the named SHA is
#                   the commit being run (nothing older, nothing else)
#   1. validate     typecheck, unit tests, native fingerprint gate and
#                   an Android bundle export (ci.yml)
#   2. render-check the release APK built from this commit draws its
#                   textures on an Android emulator and survives a
#                   background / foreground cycle (android-render-check.yml)
#   3. publish      the native fingerprint still matches the one
#                   recorded for app.json's version (an OTA must never
#                   need native code the installed APKs lack), and the
#                   commit is still the branch head (a re-run of an old
#                   run must not roll devices back).
# OTA revision numbers (run numbers of this workflow) are independent of the
# native Build NN numbers. Native/build/config changes ship as a new build
# instead (apk-build.yml). Rollback: ota-rollback.yml.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact commit to publish: the full 40-character SHA of the publishing branch head (the run must be started on that branch)'
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Seconds. Anything but the exact, current head of the publishing branch stops here, before any expensive job.
  authorize:
    name: Authorize the request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The request names the commit being run, on the publishing branch
        env:
          IN_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          SRC=$(printf '%s' "$IN_SOURCE_SHA" | tr 'A-F' 'a-f')
          if ! printf '%s' "$SRC" | grep -Eq '^[0-9a-f]{40}$'; then echo "::error::source_sha must be the full 40-character commit SHA"; exit 1; fi
          if [ "$GITHUB_REF" != "refs/heads/claude/game-review-suggestions-cjxiqh" ]; then echo "::error::An OTA is published only from the publishing branch (this run is on $GITHUB_REF)"; exit 1; fi
          if [ "$SRC" != "$GITHUB_SHA" ]; then echo "::error::source_sha $SRC is not the commit this run is on ($GITHUB_SHA): start the run on the branch at the commit you mean to publish"; exit 1; fi
          echo "authorized: OTA of $SRC from $GITHUB_REF"

  validate:
    name: Validate
    needs: authorize
    uses: ./.github/workflows/ci.yml

  render-check:
    name: Render check
    needs: [authorize, validate]
    uses: ./.github/workflows/android-render-check.yml
    with:
      ref: ${{ inputs.source_sha }}

  publish:
    name: Publish OTA bundle
    needs: [authorize, validate, render-check]
    # Only the publishing branch reaches the channel (authorize already refuses any other ref).
    if: github.ref == 'refs/heads/claude/game-review-suggestions-cjxiqh'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One queue for every publish to the `preview` channel (whatever
    # branch or workflow), never cancelled mid-way: a cancel between
    # `eas update` and the verify step would leave an update live but
    # unverified and unrecorded. GitHub keeps at most one pending run.
    concurrency:
      group: eas-update-preview
      cancel-in-progress: false
    # Metadata stamped into the published update's manifest (see
    # app.config.js): the human-readable OTA sequence is this
    # workflow's run number; the source commit is the pushed SHA.
    env:
      EE_OTA_SEQUENCE: ${{ github.run_number }}
      EE_GIT_SHA: ${{ github.sha }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # History for the "newest publishable commit" check below.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Hard gate: the native layer this JS was bundled against must be
      # the one the installed APKs of this runtime were built with.
      - name: Native fingerprint gate
        run: node scripts/check-native-fingerprint.mjs

      # The render check takes ~40 minutes. If the branch moved on meanwhile, publishing now (or from a re-run of an
      # old run) would roll devices back, so a run that is no longer the branch head stands down.
      - name: Still the branch head?
        id: head
        run: |
          git fetch --no-tags --quiet origin "$GITHUB_REF"
          HEAD_SHA=$(git rev-parse FETCH_HEAD)
          echo "branch head: $HEAD_SHA  this run: $GITHUB_SHA"
          if [ "$HEAD_SHA" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not publishing $GITHUB_SHA: the branch head is now $HEAD_SHA (start a new run for that commit)"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up EAS
        if: steps.head.outputs.current == 'true'
        uses: expo/expo-github-action@v8
        with:
          # Pinned: verify-ota.mjs and the summary parse `--json`
          # output. 24.9.0 published OTA 121; bump deliberately.
          eas-version: 24.9.0
          token: ${{ secrets.EAS }}

      # Publish to the `preview` CHANNEL (the header baked into every
      # APK by app.json updates.requestHeaders), so the destination is
      # by construction the stream installed APKs query. The update's
      # runtime version comes from app.json (policy: appVersion) and
      # must equal the installed APK's runtime to be eligible.
      - name: Publish update
        if: steps.head.outputs.current == 'true'
        id: publish
        env:
          EXPO_TOKEN: ${{ secrets.EAS }}
        run: |
          MSG="OTA $(printf '%03d' "$EE_OTA_SEQUENCE")$([ "$GITHUB_RUN_ATTEMPT" != 1 ] && echo ".$GITHUB_RUN_ATTEMPT") · $(git log -1 --pretty=%s | head -c 180)"
          eas update \
            --channel preview \
            --platform android \
            --message "$MSG" \
            --non-interactive \
            --json > update.json
          cat update.json

      - name: Verify the update is served to installed APKs
        if: steps.head.outputs.current == 'true'
        run: node scripts/verify-ota.mjs

      - name: Record published update
        if: steps.head.outputs.current == 'true'
        run: |
          node -e '
            const u = JSON.parse(require("fs").readFileSync("update.json", "utf8"));
            const list = Array.isArray(u) ? u : [u];
            const lines = ["## OTA " + String(process.env.EE_OTA_SEQUENCE).padStart(3, "0"), "",
              "| platform | update id | group | runtime | branch | commit |", "|---|---|---|---|---|---|"];
            for (const x of list) lines.push(`| ${x.platform} | ${x.id} | ${x.group} | ${x.runtimeVersion} | ${x.branch ?? ""} | ${x.gitCommitHash ?? process.env.EE_GIT_SHA} |`);
            lines.push("", "Roll back: Actions → OTA rollback, or `eas update:rollback " + (list[0]?.group ?? "<group>") + " --platform android --message \"Roll back\" --non-interactive`");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          '
